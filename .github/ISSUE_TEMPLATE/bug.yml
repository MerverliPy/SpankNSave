name: Bug report
description: Report incorrect behavior using sanitized data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private prompts, proprietary code, or unsanitized reports.
  - type: input
    id: version
    attributes:
      label: SpankNSave version or commit
    validations:
      required: true
  - type: input
    id: opencode
    attributes:
      label: OpenCode version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [observe, suggest, enforce]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction steps
    validations:
      required: true
